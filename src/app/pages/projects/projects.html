<section class="about-banner">
  <div class="about-banner__overlay"></div>
  <div class="about-banner__content">
    <h1>Projects</h1>
    <p>
      Discover the impactful projects undertaken by Eliya Foundation Trust to create lasting positive change through humanitarian support and community outreach.
    </p>
  </div>
</section>

<section class="projects-cards">
  <div class="projects-cards__grid">
    <article class="project-card" *ngFor="let card of visibleCards">
      <div class="project-card__media">
        <img [src]="card.image" [alt]="card.alt" />
      </div>
      <div class="project-card__body">
        <h3>{{ card.title }}</h3>
        <p>{{ card.description }}</p>
        <button class="project-card__button" (click)="donate()">Donate Now</button>
      </div>
    </article>
  </div>

  <div *ngIf="cards.length > maxVisible" class="projects-cards__actions">
    <button class="projects-cards__show-more" (click)="toggleShowMore()">
      {{ showAll ? 'Show Less' : 'Show More' }}
    </button>
  </div>
</section>
